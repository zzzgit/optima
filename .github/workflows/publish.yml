name: Publish to dev.to

on:
  push:
    branches: [master]
    paths:
      - "posts/**.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish posts
        uses: sinedied/publish-devto@v2
        with:
          devto_key: ${{ secrets.DEV_TO_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          files: "posts/*.md"
          branch: master
          conventional_commits: true
